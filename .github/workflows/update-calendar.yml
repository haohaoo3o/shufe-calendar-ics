name: Update Calendar ICS

on:
  schedule:
    # 每天 14:00 北京时间（06:00 UTC）重新生成课表
    - cron: '0 6 * * *'
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install icalendar

      - name: Generate ICS (demo mode; switch to --eams when EAMS opens)
        run: |
          python scripts/shufe_ics_gen.py --demo --outdir dist

      - name: Commit & push if changed
        run: |
          git config user.name "shufe-calendar-bot"
          git config user.email "shufe-calendar-bot@users.noreply.github.com"
          git add dist/course.ics
          if git diff --cached --quiet; then
            echo "no change"
          else
            git commit -m "chore: update course.ics $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push
          fi
